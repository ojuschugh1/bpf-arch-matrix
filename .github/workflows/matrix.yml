name: matrix

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: "17 3 * * 1"

permissions:
  contents: read

jobs:
  probe:
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-24.04, ubuntu-24.04-arm, ubuntu-22.04, ubuntu-22.04-arm]
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4

      - name: Install pinned tooling
        run: |
          sudo apt-get update
          sudo apt-get install -y clang libbpf-dev
          case "$(uname -m)" in
            x86_64)  bt=bpftrace-x86_64; bpftool_arch=amd64 ;;
            aarch64) bt=bpftrace-aarch64; bpftool_arch=arm64 ;;
          esac
          curl -sL -o /tmp/bpftrace "https://github.com/bpftrace/bpftrace/releases/download/v${BPFTRACE_VERSION}/$bt"
          sudo install -m 0755 /tmp/bpftrace /usr/local/bin/bpftrace
          curl -sL "https://github.com/libbpf/bpftool/releases/download/v${BPFTOOL_VERSION}/bpftool-v${BPFTOOL_VERSION}-${bpftool_arch}.tar.gz" | tar -xz -C /tmp
          sudo install -m 0755 /tmp/bpftool /usr/local/bin/bpftool
        env:
          BPFTRACE_VERSION: 0.27.0
          BPFTOOL_VERSION: 7.7.0

      - name: Show environment
        run: |
          uname -a
          sudo bpftrace --version
          bpftool version
          clang --version | head -1

      - name: Run probes
        run: sudo -E python3 runner/run.py --label "${{ matrix.runner }}"

      - uses: actions/upload-artifact@v4
        with:
          name: results-${{ matrix.runner }}
          path: results/*.json
          if-no-files-found: error

  combine:
    needs: probe
    if: always()
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          pattern: results-*
          merge-multiple: true
          path: results

      - name: Combine into matrix
        run: python3 runner/combine.py

      - uses: actions/upload-artifact@v4
        with:
          name: matrix
          path: |
            matrix.md
            matrix.json
